bot:
  name: polymarket-bot-v2
  mode: dry_run
  log_level: INFO
  heartbeat_interval_seconds: 5
  housekeeping_interval_seconds: 15
  snapshot_interval_seconds: 30
  shutdown_timeout_seconds: 10
  kill_switch_on_startup: false

market_data:
  ws_url: wss://ws-subscriptions-clob.polymarket.com/ws/market
  reconnect_initial_seconds: 1
  reconnect_max_seconds: 30
  stale_after_seconds: 10
  heartbeat_timeout_seconds: 30
  subscribed_market_ids: []
  subscribed_token_ids: []
  automatic_market:
    enabled: true
    asset: btc
    duration_minutes: 15
    refresh_lead_seconds: 10
    request_timeout_seconds: 5

execution:
  dry_run_force: true
  allow_live_trading: false
  default_order_size: 1
  max_order_size: 25
  min_order_size: 1
  max_slippage_bps: 20
  time_in_force: FOK
  client_order_id_prefix: pm-bot
  large_order_notional: 100
  min_live_buy_notional: 1
  max_live_order_notional: 1.01

exchange:
  clob_host: https://clob.polymarket.com
  data_api_host: https://data-api.polymarket.com
  chain_id: 137
  signature_type: 1
  geoblock_url: https://polymarket.com/api/geoblock
  ws_ping_interval_seconds: 10
  compliance_timeout_seconds: 5

reliability:
  live_lease_hours: 72
  task_restart_limit: 3
  task_restart_window_seconds: 600
  degraded_alert_after_seconds: 120
  authoritative_state_halt_after_seconds: 300
  rest_fallback_after_seconds: 30
  retry_initial_seconds: 1
  retry_max_seconds: 30
  retry_jitter_ratio: 0.20
  disk_warning_percent: 80
  disk_degraded_percent: 90
  disk_halt_percent: 95
  retention_interval_seconds: 3600
  signal_retention_count: 10000
  signal_retention_hours: 24
  fill_checkpoint_retention_days: 7
  realized_pnl_hot_days: 90
  closed_lifecycle_hot_count: 100
  journal_rotation_mib: 50
  journal_retention_days: 14
  journal_total_limit_mib: 500

notifications:
  telegram_enabled: false
  telegram_send_retries: 2
  repeated_failure_alert_threshold: 3
  large_order_threshold: 100
  durable_outbox_enabled: true
  telegram_deduplication_seconds: 900
  alert_retry_initial_seconds: 2
  alert_retry_max_seconds: 300
  delivered_outbox_retention_days: 30
  daily_summary_hour_utc: 0

backtest:
  starting_cash: 1000
  taker_fee_bps: 10
  allow_short_positions: true
  reject_sequence_gaps: true
  max_payout_per_share: 1

position_management:
  enabled: true
  take_profit_bps: 300
  stop_loss_bps: 200
  max_hold_seconds: 180
  exit_before_market_end_seconds: 60
  exit_retry_interval_seconds: 2
  max_exit_attempts: 3
  position_confirmation_grace_seconds: 30
  exit_time_in_force: IOC
  exit_on_strategy_sell: true
  liquidate_full_position: true
