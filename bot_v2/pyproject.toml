[project]
name = "polymarket-bot-v2"
version = "0.1.0"
description = "Production-minded, dry-run-first Polymarket bot."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "PyYAML>=6.0.1",
  "py-clob-client-v2==1.1.0",
  "websockets>=14.2,<18",
  "httpx>=0.27.0",
  "structlog>=24.2.0",
  "fastapi>=0.141.1,<0.142",
  "uvicorn>=0.52.1,<0.53",
  "Jinja2>=3.1.6,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
  "app*",
  "backtest*",
  "clients*",
  "config*",
  "dashboard*",
  "execution*",
  "models*",
  "notifications*",
  "persistence*",
  "portfolio*",
  "risk*",
  "state*",
  "strategies*",
]
namespaces = true

[tool.setuptools.package-data]
config = ["*.yaml", "strategies/*.yaml"]
dashboard = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "backtest"]
pythonpath = ["."]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
