services:
  polymarket-bot:
    build: .
    image: polymarket-bot-v2:latest
    restart: unless-stopped
    # The dashboard binds to loopback only. On a Linux host you may use
    # network_mode: host together with SSH access instead of publishing ports.
    command:
      ["python", "-m", "dashboard.main", "--host", "127.0.0.1", "--port", "8000"]
    env_file:
      - deploy/polymarket-bot.env
    environment:
      - BOT_DATA_DIR=/data
    volumes:
      - ./config:/app/config:ro
      - ./data:/data:rw
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-m", "scripts.healthcheck", "--kind", "liveness"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
